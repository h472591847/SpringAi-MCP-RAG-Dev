name: SpringAi-MCP-RAG-Dev

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack-local
    ports:
      - "9379:6379"   # Redis 默认端口
      - "8001:8001"   # RedisInsight 可视化界面端口
    volumes:
      - ./volumes/docker/redis-stack/data:/data
    # 核心修改：通过 environment 设置 Redis 密码
    environment:
      - REDIS_ARGS=--requirepass 123456
    restart: always

  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - "6080:8080"
    env_file: .env
    volumes:
      - ./volumes/docker/searxng/core-config:/etc/searxng/:Z
      - ./volumes/docker/searxng/core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - ./volumes/docker/searxng/valkey-data:/data/
